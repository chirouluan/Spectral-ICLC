# User-aligned four-batch browser experiment export, 2026-10-20.
output: data_json/generated
surimi_config: surimi.yaml
public_config: public_datasets.yaml
repeats: 5
include_full_reference: true
context_k: [1, 3, 5]
support_seed: 12345
feature_decimals: 8
batch_01:
  days: [0, 7, 14]
batch_02:
  t2_pairs: [[0, 7], [0, 14], [7, 14]]
  include_t3: false
batch_03:
  days: [0, 7, 14]
  heldout_levels: [15, 30]
  lda_dimensions: 6
batch_04:
  datasets: [coffee, olive_oils, turmeric_authenticity, beef]
  # Keep complete query partitions, not chunks or evaluation subsets.
  whole_val_test: true
  beef_validation_per_class: 1
